  @font-face{
    font-family:"Inter";font-style:normal;font-display:swap;font-weight:100 900;
    src:url("./fonts/inter-cyrillic-wght-normal.woff2") format("woff2-variations");
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
  }
  @font-face{
    font-family:"Inter";font-style:normal;font-display:swap;font-weight:100 900;
    src:url("./fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    /* warm-amber light — clean amber → deep orange, bright pooled at bottom (per Figma) */
    --core:#FFF6E4; --c1:#FFE1A6; --c2:#FDB84F; --c3:#F58A1E; --c4:#D65A0C; --c5:#9c4207; --top:#5a2103;
    --halo:rgba(255,150,50,.45);
    --serif:"Libertinus Serif","Times New Roman",Georgia,"Iowan Old Style",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  .page{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0c0a09;padding:24px;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  /* ---- phone frame : iPhone 17, 402 x 874 ---- */
  .frame{
    position:relative;width:402px;height:874px;flex:0 0 auto;
    border-radius:54px;overflow:hidden;
    background:linear-gradient(204.7deg,#130b07 0%,#26140d 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.03);
    color:#fff;font-family:var(--sans);isolation:isolate;
  }
  /* subtle starfield + upper warm glow */
  .frame::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 70% at 72% -8%, rgba(255,150,60,.20), rgba(255,150,60,0) 60%),
      radial-gradient(1px 1px at 18% 84%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 62% 12%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.2px 1.2px at 84% 46%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 30% 30%, rgba(255,255,255,.28), transparent),
      radial-gradient(1px 1px at 46% 70%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 8% 52%, rgba(255,255,255,.22), transparent),
      radial-gradient(1.3px 1.3px at 90% 78%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 74% 62%, rgba(255,255,255,.25), transparent);
  }

  /* ---- status bar ---- */
  .statusbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px 0;font-weight:600;font-size:16px;letter-spacing:.2px}
  .statusbar .glyphs{display:flex;align-items:center;gap:7px}
  .statusbar svg{display:block}

  /* ---- layout stage ---- */
  .stage{position:absolute;left:16px;top:66px;width:370px;height:783px;z-index:3;
    display:flex;flex-direction:column;gap:32px}
  .col{display:flex;flex-direction:column;justify-content:space-between;height:687px}

  /* header */
  .header{display:flex;flex-direction:column;gap:32px}
  .topbar{display:flex;align-items:center;justify-content:space-between}
  .gbtn{display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border-radius:999px;
    cursor:pointer;transition:transform .15s ease,background .25s ease}
  .gbtn.back,.gbtn.gear{width:40px;height:40px}
  .gbtn svg{display:block}
  .wordmark{font-family:var(--serif);font-style:normal;font-size:23px;
    letter-spacing:.3px;color:#fff;line-height:1;user-select:none}
  .wordmark .wm-roman{font-style:normal}
  .wordmark .wm-italic{font-style:italic}

  /* switcher (.tabs/.tabs-track/.tab/.tab-pill) стилизуется в motion.css */
  .tab{border:none;font-family:var(--sans)}

  /* main : sphere + description */
  .main{display:flex;flex-direction:column;gap:32px;align-items:center}

  .sun-stage{position:relative;width:241px;height:241px;display:grid;place-items:center}
  .sun-halo{position:absolute;width:352px;height:352px;border-radius:50%;
    background:radial-gradient(closest-side,var(--halo),rgba(255,150,50,0) 70%);
    filter:blur(6px);z-index:0;animation:breathe 7s ease-in-out infinite}

  .sun{position:relative;width:241px;height:241px;border-radius:50%;z-index:1;
    box-shadow:0 26px 60px -12px rgba(255,110,20,.35), 0 0 0 1px rgba(255,255,255,.06)}

  /* inner living light — bright pooled toward the bottom (per Figma ellipses) */
  .sun-light{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    background:radial-gradient(140% 110% at 50% 116%,
      var(--core) 0%, var(--c1) 13%, var(--c2) 27%, var(--c3) 41%,
      var(--c4) 57%, var(--c5) 79%, var(--top) 100%)}
  .plasma{position:absolute;border-radius:50%;mix-blend-mode:screen;filter:blur(16px);opacity:.75}
  .plasma.a{width:150px;height:120px;left:26%;top:54%;
    background:radial-gradient(closest-side,rgba(255,214,140,.9),transparent);
    animation:drift1 9s ease-in-out infinite}
  .plasma.b{width:120px;height:110px;left:48%;top:42%;
    background:radial-gradient(closest-side,rgba(255,120,30,.7),transparent);
    animation:drift2 11s ease-in-out infinite}

  /* rim / reflections read as glass */
  .rimlight{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
    background:
      radial-gradient(70% 34% at 50% 1%, rgba(200,222,255,.22), transparent 60%),
      radial-gradient(120% 120% at 30% 22%,rgba(255,255,255,.16),transparent 30%),
      radial-gradient(90% 90% at 80% 90%,rgba(255,190,120,.20),transparent 44%)}

  /* glass shell — fresnel edge, inner shading, bottom caustic */
  .sun-glass{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,.16),
      inset 0 1.5px 1px rgba(255,255,255,.32),
      inset 7px 9px 22px rgba(255,247,235,.24),
      inset -13px -15px 36px rgba(35,10,0,.5),
      inset 0 -7px 16px rgba(255,206,140,.28)}
  /* main glare (top-left) */
  .sun-glass::before{content:"";position:absolute;left:13%;top:7%;width:47%;height:33%;
    border-radius:50%;transform:rotate(-20deg);filter:blur(2px);
    background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(255,255,255,.15) 55%,transparent 72%)}
  /* bottom caustic focus */
  .sun-glass::after{content:"";position:absolute;left:16%;right:16%;bottom:5%;height:20%;
    border-radius:50%;filter:blur(3px);
    background:radial-gradient(closest-side,rgba(255,240,205,.9),rgba(255,214,155,.25) 55%,transparent 76%)}
  .spec{position:absolute;left:24%;top:13%;width:11px;height:11px;border-radius:50%;z-index:3;
    background:radial-gradient(closest-side,#fff,rgba(255,255,255,0));filter:blur(.4px)}
  .spec.b{left:36%;top:22%;width:6px;height:6px;opacity:.8}

  /* description */
  .desc{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;width:100%}
  .title{font-family:var(--serif);font-style:italic;font-size:48px;line-height:48px;
    letter-spacing:-1.08px;color:#fff;display:flex;align-items:flex-start;
    justify-content:center;gap:6px}
  .title .edit{width:14px;height:14px;margin-top:4px;flex:0 0 auto}
  .subtitle{font-family:var(--sans);font-size:18px;color:rgba(255,255,255,.62)}

  /* slider */
  .sliderwrap{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
  .slider{display:flex;align-items:center;justify-content:space-between;width:100%}
  .track{height:8px}
  .track.warm{width:263px;border-radius:12px 2px 2px 12px;
    background:linear-gradient(90deg,#fff 0%,#fff600 50%,#ff6200 100%)}
  .track.cool{width:91px;border-radius:2px 12px 12px 2px;
    background:linear-gradient(90deg,#00bbff 0%,#003cff 50%,#fff 100%)}
  .handle{width:8px;height:25px;border-radius:999px;background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .labels{display:flex;align-items:center;justify-content:space-between;width:100%;
    font-size:16px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}

  /* order button */
  .order{width:100%;height:64px;border-radius:60px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    color:#fff;font-family:var(--sans);font-size:16px;font-weight:500;letter-spacing:-.4px;
    cursor:pointer;transition:transform .15s ease,background .25s ease}
  .order:hover{background:rgba(255,255,255,.14)}

  .home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
    width:139px;height:5px;border-radius:999px;background:rgba(255,255,255,.6);z-index:6}

  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-8px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-9px,7px)}}
  @media (prefers-reduced-motion:reduce){.sun-halo,.plasma{animation:none}}
</style>

          <label class="settings-control">
            <span class="settings-control-head"><strong>Радиус bloom</strong><output data-output-for="bloomRadius">1.60</output></span>
            <input type="range" min="0.25" max="3.5" step="0.05" value="1.6" data-orb-param="bloomRadius" aria-label="Радиус bloom">
            <span class="settings-help">Ширина свечения без размытия самой сферы.</span>
          </label>

          <label class="settings-control">
            <span class="settings-control-head"><strong>Порог bloom</strong><output data-output-for="bloomThreshold">0.42</output></span>
            <input type="range" min="0.05" max="0.9" step="0.01" value="0.42" data-orb-param="bloomThreshold" aria-label="Порог bloom">
            <span class="settings-help">Какие по яркости области начинают светиться наружу.</span>
          </label>
        </section>

        <section class="settings-group" aria-labelledby="global-settings-title">

          <label class="settings-control">
            <span class="settings-control-head"><strong>Скорость анимации</strong><output data-output-for="motion">1.00</output></span>

          </label>

          <label class="settings-control">
            <span class="settings-control-head"><strong>Экспозиция</strong><output data-output-for="exposure">1.50</output></span>
            <input type="range" min="0.4" max="3.2" step="0.01" value="1.5" data-orb-param="exposure" aria-label="Экспозиция">
            <span class="settings-help">Общая яркость до bloom.</span>
          </label>

          <label class="settings-control">
            <span class="settings-control-head"><strong>Насыщенность</strong><output data-output-for="saturation">1.20</output></span>

          </label>

          <label class="settings-control">
            <span class="settings-control-head"><strong>Чёткость</strong><output data-output-for="sharpness">8.5</output></span>
            <input type="range" min="0.35" max="1" step="0.01" value="0.85" data-orb-param="sharpness" aria-label="Чёткость">
            <span class="settings-help">Разрешение рендера и нагрузка на GPU.</span>
          </label>
        </section>
